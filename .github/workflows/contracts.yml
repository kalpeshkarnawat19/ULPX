name: Contract validation

on:
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'fixtures/contracts/**'
      - 'tests/contracts/**'
      - 'Makefile'
      - 'infra/airgap/**'
      - 'tests/airgap/**'
      - 'tests/demo/**'
      - 'tools/demo/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test-contracts

  stage-20-21-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: make test-airgap demo-check
